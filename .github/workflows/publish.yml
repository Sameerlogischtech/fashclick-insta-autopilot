# Schedule owner: Sameerlogischtech
# Posts scheduled reels, photos, carousels and stories (Instagram and Facebook) when their time comes.
# Schedule them from your Mac with:  python content.py add <files> --at "..." --account <brand>
# Runs once per brand; a brand without its IG_USER_ID secret is skipped.
#
# Needs repository secrets: IG_ACCESS_TOKEN, CONTENT_KEY,
#   IG_USER_ID (fashclick), IG_USER_ID_VAANICRAFT, IG_USER_ID_VRITTOS, FB_PAGE_ID[_VAANICRAFT|_VRITTOS]
name: Publish scheduled content

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be posted"
        type: boolean
        default: false

permissions:
  contents: write   # to save published/<brand>/ photos and content/<brand>/posted.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one brand's problem never stops the others
      matrix:
        account: [fashclick, vaanicraft, vrittos]
    # Never let two runs for the same brand overlap, or the same post could go out twice.
    concurrency:
      group: publish-${{ matrix.account }}
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ matrix.account }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so a lost push race can rebase cleanly

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post anything that's due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USER_ID_VAANICRAFT: ${{ secrets.IG_USER_ID_VAANICRAFT }}
          IG_USER_ID_VRITTOS: ${{ secrets.IG_USER_ID_VRITTOS }}
          IG_ACCESS_TOKEN_VAANICRAFT: ${{ secrets.IG_ACCESS_TOKEN_VAANICRAFT }}
          IG_ACCESS_TOKEN_VRITTOS: ${{ secrets.IG_ACCESS_TOKEN_VRITTOS }}
          CONTENT_KEY: ${{ secrets.CONTENT_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ID_VAANICRAFT: ${{ secrets.FB_PAGE_ID_VAANICRAFT }}
          FB_PAGE_ID_VRITTOS: ${{ secrets.FB_PAGE_ID_VRITTOS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_VAANICRAFT: ${{ secrets.YT_REFRESH_TOKEN_VAANICRAFT }}
          YT_REFRESH_TOKEN_VRITTOS: ${{ secrets.YT_REFRESH_TOKEN_VRITTOS }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python content.py post-due
